<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>+Q´FRAGANCIAS | Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--gold:#d4af37;--gold2:#f3d97a;--line:#3a2f10;--txt:#f1ead6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1d1704,var(--bg) 55%);color:var(--txt);font-family:'Montserrat',system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:40px 16px 18px;border-bottom:1px solid var(--line)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2rem,7vw,3.6rem);margin:0;letter-spacing:.12em;background:linear-gradient(90deg,#9b7a1c,var(--gold2),#9b7a1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.72rem;letter-spacing:.5em;color:var(--gold);margin-top:6px;text-transform:uppercase}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(10,10,10,.92);backdrop-filter:blur(6px);z-index:5}
nav button{background:none;border:1px solid var(--line);color:var(--txt);padding:10px 20px;letter-spacing:.2em;text-transform:uppercase;font:500 .72rem 'Montserrat',sans-serif;cursor:pointer;transition:.2s}
nav button:hover{border-color:var(--gold);color:var(--gold)}
nav button.on{background:linear-gradient(135deg,#b8902a,var(--gold2));color:#000;border-color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:10px 16px 80px}
h2{font-family:'Cormorant Garamond',Georgia,serif;text-align:center;font-size:2.2rem;color:var(--gold);margin:14px 0 4px;letter-spacing:.15em;text-transform:uppercase}
.orn{width:90px;height:1px;background:var(--gold);margin:0 auto 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);padding:10px;position:relative;transition:.25s}
.card:hover{border-color:var(--gold);transform:translateY(-3px)}
.img{min-height:200px;background:#0d0d0d;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:#5c4a1a;font-size:.75rem;letter-spacing:.15em;text-align:center}
.img img{width:100%;height:auto;display:block}
.name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;text-align:center;padding:12px 4px 6px;color:var(--gold2)}
input.name{width:100%;background:#0d0d0d;border:1px dashed var(--gold);color:var(--gold2);outline:none}
.edit-only{display:none}
body.edit .edit-only{display:block}
body.edit .img{cursor:pointer;outline:1px dashed var(--gold)}
.del{position:absolute;top:14px;right:14px;background:#000c;border:1px solid var(--gold);color:var(--gold);width:30px;height:30px;cursor:pointer;font-size:1rem;z-index:2}
.add{border:1px dashed var(--gold);background:none;color:var(--gold);min-height:260px;cursor:pointer;letter-spacing:.2em;font:500 .75rem 'Montserrat',sans-serif;text-transform:uppercase}
.empty{text-align:center;color:#7d6a2b;padding:50px 10px;grid-column:1/-1;font-size:.85rem}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#b8902a,var(--gold2));color:#000;border:0;padding:13px 20px;font:500 .75rem 'Montserrat',sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 18px #000a;z-index:9}
.hint{text-align:center;font-size:.7rem;color:var(--gold);letter-spacing:.1em;margin-bottom:16px}
footer{text-align:center;font-size:.65rem;letter-spacing:.3em;color:#7d6a2b;padding:24px}
</style>
</head>
<body>
<header><h1>+Q´FRAGANCIAS</h1><div class="sub">Catálogo de perfumería</div></header>
<nav id="nav"></nav>
<main><h2 id="title"></h2><div class="orn"></div><div class="hint edit-only">MODO EDICIÓN: toca la imagen para cambiarla, escribe el nombre o elimina con ✕</div><div class="grid" id="grid"></div></main>
<footer>+Q´FRAGANCIAS · AROMAS QUE DEJAN HUELLA</footer>
<button class="fab" id="pub" hidden style="bottom:calc(70px + env(safe-area-inset-bottom,0px))">⬇ Descargar catálogo</button>
<button class="fab" id="fab" hidden>✎ Editar</button>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="multi" accept="image/*" multiple hidden>
<script type="application/json" id="seed">{}</script>
<script>
const SECS=[['hombres','Hombres'],['premium','Premium'],['mujeres','Mujeres'],['splash','Splash'],['ambientadores','Ambientadores']];
let data={};SECS.forEach(s=>data[s[0]]=[]);
let cur='hombres',editing=false,target=null,db=null,canEdit=false;
const $=id=>document.getElementById(id);
const seedStr=$('seed').textContent.trim()||'{}';
try{data=Object.assign(data,JSON.parse(seedStr))}catch(e){}

function openDB(){return new Promise(res=>{try{const r=indexedDB.open('qfrag',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function readDraft(){return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get('catalog');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function save(){if(!canEdit||!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put({base:seedStr,data},'draft2')}catch(e){console.error(e)}}

function resize(file){return new Promise(res=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const m=650,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};i.onerror=()=>res(null);i.src=u})}

function render(){
  $('nav').replaceChildren(...SECS.map(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(k===cur)b.className='on';b.onclick=()=>{cur=k;render()};return b}));
  $('title').textContent=SECS.find(s=>s[0]===cur)[1];
  document.body.classList.toggle('edit',editing);
  $('fab').textContent=editing?'✓ Listo':'✎ Editar';
  $('pub').hidden=!(canEdit&&editing);
  const g=$('grid');g.replaceChildren();
  const list=data[cur];
  if(!list.length&&!editing){const e=document.createElement('div');e.className='empty';e.textContent='Próximamente nuevos productos';g.append(e)}
  list.forEach((p,idx)=>{
    const c=document.createElement('div');c.className='card';
    if(editing){const d=document.createElement('button');d.className='del';d.textContent='✕';d.onclick=()=>{if(confirm('¿Eliminar este producto?')){list.splice(idx,1);save();render()}};c.append(d)}
    const im=document.createElement('div');im.className='img';
    if(p.img){const t=document.createElement('img');t.src=p.img;t.alt=p.name;im.append(t)}else im.textContent=editing?'+ AGREGAR IMAGEN':'+Q´FRAGANCIAS';
    im.onclick=()=>{if(editing){target=p;$('file').click()}};
    c.append(im);
    if(editing){const n=document.createElement('input');n.className='name';n.value=p.name;n.placeholder='Nombre del producto';n.oninput=()=>{p.name=n.value;save()};c.append(n)}
    else{const n=document.createElement('div');n.className='name';n.textContent=p.name;c.append(n)}
    g.append(c);
  });
  if(editing){const a=document.createElement('button');a.className='add';a.textContent='+ Agregar productos (una o varias imágenes)';a.onclick=()=>$('multi').click();g.append(a)}
}

$('fab').onclick=()=>{editing=!editing;render();scrollTo({top:0,behavior:'smooth'})};
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!target)return;const d=await resize(f);if(d){target.img=d;save();render()}};
$('multi').onchange=async e=>{const fs=[...e.target.files];e.target.value='';for(const f of fs){const d=await resize(f);if(d)data[cur].push({id:Date.now()+Math.random(),name:f.name.replace(/\.[^.]+$/,'').slice(0,40)||'Nuevo producto',img:d})}save();render()};

$('pub').onclick=()=>{
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#grid').replaceChildren();c.querySelector('#nav').replaceChildren();c.querySelector('#title').textContent='';
  c.querySelector('body').className='';
  c.querySelector('#fab').setAttribute('hidden','');c.querySelector('#pub').setAttribute('hidden','');
  c.querySelector('#fab').textContent='✎ Editar';c.querySelector('#pub').textContent='⬇ Descargar catálogo';
  c.querySelector('#seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
  const blob=new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'});
  const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='index.html';document.body.append(l);l.click();l.remove();
};

async function initEditor(){
  if(location.hash!=='#editar')return;
  canEdit=true;$('fab').hidden=false;
  db=await openDB();
  if(db){try{const q=await new Promise(r=>{const x=db.transaction('kv').objectStore('kv').get('draft2');x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)});
    if(q&&q.base===seedStr&&q.data)data=Object.assign(data,q.data)}catch(e){}}
  render();
}
render();initEditor();
</script>
</body>
</html>
